<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة الترجمة</title>
<style>
  :root { --size: 3.4vw; --color: #ffffff; --bg: rgba(0,0,0,.72); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: Tahoma, "Segoe UI", Arial, sans-serif; }
  #status { position: fixed; top: 2vh; left: 2vw; display: flex; align-items: center; gap: .6vw;
    color: #8a8f98; font-size: 1.6vw; }
  #dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #c0392b; }
  #dot.on { background: #2ecc71; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #5b616b; font-size: 3vw; }
  #sub { position: fixed; left: 8vw; right: 8vw; bottom: 8vh; text-align: center; display: none; }
  #sub.top { bottom: auto; top: 8vh; }
  #sub .box { display: inline-block; padding: .5em 1em; border-radius: .3em; background: var(--bg);
    color: var(--color); font-size: var(--size); line-height: 1.6; }
  #who { display: block; color: #f1c40f; font-size: .7em; margin-bottom: .1em; }
</style>
</head>
<body>
<div id="status"><span id="dot"></span><span id="st">غير متصل</span></div>
<div id="wait">في انتظار الترجمة…</div>
<div id="sub"><div class="box"><span id="who"></span><span id="txt"></span></div></div>

<script>
(function () {
  var sub = document.getElementById('sub'), txt = document.getElementById('txt'),
      who = document.getElementById('who'), wait = document.getElementById('wait'),
      dot = document.getElementById('dot'), st = document.getElementById('st'),
      root = document.documentElement, timer = null, ws = null;

  function show(text, speaker) {
    wait.style.display = 'none';
    txt.textContent = text;
    who.textContent = speaker || '';
    who.style.display = speaker ? 'block' : 'none';
    sub.style.display = text ? 'block' : 'none';
    clearTimeout(timer);
    timer = setTimeout(function () { sub.style.display = 'none'; }, 6000);
  }

  function style(m) {
    if (m.size) root.style.setProperty('--size', m.size + 'vw');
    if (m.color) root.style.setProperty('--color', m.color);
    if (m.bg) root.style.setProperty('--bg', m.bg);
    if (m.position) sub.className = m.position === 'top' ? 'top' : '';
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.hostname + ':8081');
    ws.onopen = function () { dot.className = 'on'; st.textContent = 'متصل'; };
    ws.onmessage = function (e) {
      try {
        var m = JSON.parse(e.data);
        if (m.type === 'sub') show(m.text, m.speaker);
        else if (m.type === 'style') style(m);
      } catch (err) {}
    };
    ws.onclose = function () {
      dot.className = ''; st.textContent = 'غير متصل';
      setTimeout(connect, 2000);
    };
    ws.onerror = function () { ws.close(); };
  }
  connect();
})();
</script>
</body>
</html>
